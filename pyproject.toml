[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tlseval"
version = "0.2.0"
description = "Voxel-based evaluation and analysis for TLS individual-tree segmentation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.21", "pandas>=1.3", "laspy[lazrs]>=2.0", "scipy>=1.7"]

[project.optional-dependencies]
report = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.scripts]
tlseval = "tlseval.cli:main"

[tool.setuptools]
packages = ["tlseval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
